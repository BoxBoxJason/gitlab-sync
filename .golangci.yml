version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly
  tests: true
  # The end-to-end harness (test/e2e) is only compiled with this tag.
  build-tags:
    - e2e

# Output format to generate checkstyle report (used by CI)
output:
  formats:
    checkstyle:
      path: codequality/golangci-lint-report.xml
    text:
      path: stdout
formatters:
  enable:
    - gofmt
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/boxboxjason/gitlab-sync
    gofmt:
      simplify: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false

linters:
  default: all
  exclusions:
    rules:
      # Style-only linters that add noise to tests without catching bugs.
      - path: _test\.go
        linters:
          - dupl
          - funlen
          - gosec
          - gochecknoglobals
          - goconst
          - nlreturn
          - noinlineerr
          - varnamelen
          - wsl_v5
      # Table-driven tests are inherently long and branchy.
      - path: _test\.go
        linters:
          - cyclop
          - gocognit
          - gocyclo
          - maintidx
      - path: _test\.go
        linters:
          - revive
        text: "function-length"
      # Tests exercise unexported identifiers (white-box), so they must live in the package under test.
      - path: _test\.go
        linters:
          - testpackage
  disable:
    - err113
    - exhaustruct
    - exhaustruct_v5
    - gomodguard
    - ireturn
    - lll
    - tagliatelle
    - wsl
  settings:
    copyloopvar:
      check-alias: true
    depguard:
      rules:
        main:
          # Whitelist: only the listed packages may be imported.
          list-mode: strict
          files:
            - $all
          allow:
            - $gostd
            - github.com/boxboxjason/gitlab-sync
            - github.com/cucumber/godog
            - github.com/go-git/go-git/v5
            - github.com/hashicorp/go-retryablehttp
            - github.com/Masterminds/semver/v3
            - github.com/spf13/cobra
            - github.com/spf13/pflag
            - github.com/stretchr/testify
            - gitlab.com/gitlab-org/api/client-go/v3
            - go.uber.org/zap
    errcheck:
      # Report about not checking of errors in type assertions: `a := b.(MyStruct)`.
      check-type-assertions: true
      # Report about assignment of errors to blank identifier: `num, _ := strconv.Atoi(numStr)`.
      check-blank: true
      # List of functions to exclude from checking, where each entry is a single function to exclude.
      exclude-functions:
        - io/ioutil.ReadFile
        - io.Copy(*bytes.Buffer)
        - io.Copy(os.Stdout)
    exhaustive:
      default-signifies-exhaustive: true
    fatcontext:
      # Check for potential fat contexts in struct pointers.
      # May generate false positives.
      check-struct-pointers: true
    gocritic:
      enable-all: true
    gosec:
      excludes:
        - G117 # secret pattern matches in exported structs (required for API client)
        - G704 # SSRF false positives on client HTTP calls (required for API client)
    govet:
      enable-all: true
      settings:
        shadow:
          # Whether to be strict about shadowing; can be noisy.
          strict: true
    grouper:
      # Left off: gofumpt ungroups single-item blocks, which would conflict with these two.
      const-require-grouping: false
      # Require the use of a single 'import' declaration only.
      import-require-grouping: true
      var-require-grouping: false
    ineffassign:
      # Check escaping variables of type error, may cause false positives.
      check-escaping-errors: true
    nilnil:
      # To check functions with only two return values (`return nil, nil`).
      only-two: false
      # In addition, detect opposite situation (simultaneous return of non-nil error and valid value).
      detect-opposite: true
    nolintlint:
      # Fail on nolint directives that no longer suppress anything.
      allow-unused: false
      # Enable to require an explanation of nonzero length after each nolint directive.
      require-explanation: true
      # Enable to require nolint directives to mention the specific linter being suppressed.
      require-specific: true
    nonamedreturns:
      # Report named error if it is assigned inside defer.
      report-error-in-defer: true
    paralleltest:
      # Check that `defer` is not used with `t.Parallel`.
      # (use `t.Cleanup` instead to ensure cleanup runs after parallel subtests complete).
      check-cleanup: true
    revive:
      enable-all-rules: true
      rules:
        - name: add-constant
          disabled: true
        - name: cognitive-complexity
          disabled: true
        - name: cyclomatic
          disabled: true
        - name: file-length-limit
          arguments:
            - max: 300
        - name: line-length-limit
          disabled: true
    testifylint:
      enable-all: true
    unconvert:
      # Remove conversions that force intermediate rounding.
      fast-math: true
      # Be more conservative (experimental).
      safe: true
    unparam:
      # Inspect exported functions.
      # Set to true if no external program/library imports your code.
      check-exported: true
    unused:
      # Treat IncDec statement (e.g. `i++` or `i--`) as both read and write operation instead of just write.
      post-statements-are-reads: true
      # Mark all exported fields as used.
      exported-fields-are-used: false
      # Mark all function parameters as used.
      parameters-are-used: false
      # Mark all local variables as used.
      local-variables-are-used: false
      # Mark all identifiers inside generated files as used.
      generated-is-used: false
    usestdlibvars:
      # Suggest the use of time.Month in time.Date.
      time-date-month: true
      # Suggest the use of time.Weekday.String().
      time-weekday: true
      # Suggest the use of time.Month.String().
      time-month: true
      # Suggest the use of time.Layout.
      time-layout: true
      # Suggest the use of crypto.Hash.String().
      crypto-hash: true
      # Suggest the use of rpc.DefaultXXPath.
      default-rpc-path: true
      # Suggest the use of sql.LevelXX.String().
      sql-isolation-level: true
      # Suggest the use of tls.SignatureScheme.String().
      tls-signature-scheme: true
      # Suggest the use of constant.Kind.String().
      constant-kind: true
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2
